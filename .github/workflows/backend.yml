name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The suite is offline by design — no Supabase or Anthropic credentials
        # needed, and no live portal is contacted.
        run: pytest -q

      - name: Check the app imports and routes register
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-key
          SCHEDULER_ENABLED: "false"
        run: python -c "from app.main import app; print(len(app.routes), 'routes')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        # Skip Playwright here — it adds ~500MB and several minutes, and no
        # currently active scraper needs it.
        run: docker build --build-arg INSTALL_PLAYWRIGHT=false -t sarkarisaar-backend ./backend
